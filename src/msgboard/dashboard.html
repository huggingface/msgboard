// 30 daily bars, one series in ink; hover shows the day and count.
function drawActivity(host, days) {
  const W = 352, H = 92, top = 14, base = H - 18, gap = 2, n = days.length;
  const bw = (W - gap * (n - 1)) / n, max = Math.max(1, ...days.map((d) => d.count));
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Messages per day for the last ${n} days">`;
  svg += `<line class="axis" x1="0" x2="${W}" y1="${base + 0.5}" y2="${base + 0.5}"/>`;
  days.forEach((d, i) => {
    const x = i * (bw + gap), h = d.count ? Math.max(2, (base - top) * d.count / max) : 0;
    if (d.count) svg += `<rect class="bar-rect" data-i="${i}" x="${x.toFixed(2)}" y="${(base - h).toFixed(2)}" width="${bw.toFixed(2)}" height="${h.toFixed(2)}" rx="1"/>`;
    svg += `<rect data-i="${i}" x="${x.toFixed(2)}" y="0" width="${(bw + gap).toFixed(2)}" height="${H}" fill="transparent"/>`;
  });
  const label = (t) => new Date(t * 1000).toLocaleDateString([], { day: "numeric", month: "short", timeZone: "UTC" });
  svg += `<text x="0" y="${H - 3}">${esc(label(days[0].day))}</text><text x="${W}" y="${H - 3}" text-anchor="end">today</text>`;
  svg += `<text x="0" y="9">${max}/day</text></svg><div class="tip hidden"></div>`;
  host.innerHTML = svg;
  const tip = host.querySelector(".tip"), el = host.querySelector("svg");
  el.addEventListener("mousemove", (e) => {
    const i = e.target.dataset ? e.target.dataset.i : undefined;
    if (i === undefined) return;
    const d = days[Number(i)], r = el.getBoundingClientRect(), scale = r.width / W;
    host.classList.add("hovering");
    host.querySelectorAll(".bar-rect").forEach((b) => b.classList.toggle("on", b.dataset.i === i));
    tip.textContent = `${new Date(d.day * 1000).toLocaleDateString([], { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" })} · ${d.count} ${d.count === 1 ? "message" : "messages"}`;
    tip.classList.remove("hidden");
    // keep the tooltip inside the chart: anchor it left or right near the edges
    const x = (Number(i) * (bw + gap) + bw / 2) * scale, half = tip.offsetWidth / 2;
    const shift = x < half ? "0%" : x > r.width - half ? "-100%" : "-50%";
    tip.style.transform = `translate(${shift}, -100%)`;
    tip.style.left = `${x}px`; tip.style.top = `${top * scale - 4}px`;
  });
  el.addEventListener("mouseleave", () => { host.classList.remove("hovering"); tip.classList.add("hidden"); });
}

const SEARCH_OPS = /(^|\s)(from|in|before|after|on|has|is|by|to|mentions):("[^"]*"|\S+)/gi;
// the words to highlight: the query without its filters
function searchTerms(q) {
  const plain = q.replace(SEARCH_OPS, " ");
  const phrases = [...plain.matchAll(/"([^"]+)"/g)].map((m) => m[1].toLowerCase());
  const words = plain.replace(/"[^"]*"/g, " ").split(/\s+/).map((w) => w.replace(/[^\p{L}\p{N}_]/gu, "").toLowerCase()).filter(Boolean);
  return [...phrases, ...words];

function highlight(root, terms) {

  for (let n = walker.nextNode(); n; n = walker.nextNode()) if (!n.parentElement.closest("mark, .katex")) texts.push(n);
  const re = new RegExp(terms.map((t) => (t.includes(" ") ? "" : "(?<![\\p{L}\\p{N}_])") + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|"), "giu");
  for (const node of texts) {
    const text = node.nodeValue; re.lastIndex = 0;
    if (!re.test(text)) continue;
    re.lastIndex = 0;
    const frag = document.createDocumentFragment(); let last = 0;
    for (const m of text.matchAll(re)) {
      frag.append(text.slice(last, m.index));
      // a word matches as a prefix (like the server does): mark the whole word
      let end = m.index + m[0].length;
      if (!m[0].includes(" ")) while (end < text.length && /[\p{L}\p{N}_]/u.test(text[end])) end++;
      const mark = document.createElement("mark"); mark.textContent = text.slice(m.index, end);
      frag.append(mark); last = end;
    }
    frag.append(text.slice(last)); node.replaceWith(frag);
  }
}

  if (!more) box.innerHTML = `<div class="empty">Searching…</div>`;
  let res;
  try { res = await api("GET", "/search?" + params); }
  catch (e) { if (seq === state.searchSeq) box.innerHTML = `<div class="empty"><span class="err">${esc(e.message)}</span></div>`; return; }
  if (seq !== state.searchSeq || state.view !== "search") return;
  state.searchNext = res.next_offset;
  const terms = searchTerms(q);
  let html = "";
  if (!more) {
    if (res.channels.length || res.people.length) {
      html += `<div class="smatches">` +
        res.channels.map((c) => `<button class="schip" data-channel="${c.id}"><span class="glyph">${c.kind === "private" ? LOCK : "#"}</span>${esc(c.name)}</button>`).join("") +
        res.people.map((p) => `<button class="schip" data-profile="${p.id}">${avatar(p, "xs", false)}${esc(nameOf(p))}</button>`).join("") + `</div>`;
    }
    html += `<div class="scount label">${res.total_capped ? "1000+" : res.total} message${res.total === 1 ? "" : "s"}</div>`;
  }
  html += res.messages.map((m) => `<div class="act sres" data-mid="${m.id}">${avatar(m.sender, "", false)}<div style="min-width:0">
      <div class="where"><b style="color:var(--ink);font-family:var(--sans);font-size:13px">${esc(nameOf(m.sender))}</b><span>${esc(whereLabel(m.channel))}</span>
      <span>${esc(fmtDay(m.created_at))} ${esc(fmtTime(m.created_at))}</span>${m.thread_id ? `<span>in a thread</span>` : ""}</div>
      <div class="${bodyClass()}">${renderBody(m.body, m.mentions || [])}</div></div></div>`).join("");
  if (!more && !res.messages.length) html += `<div class="empty">No messages match.${res.total === 0 && q ? " Try fewer words or a word start." : ""}</div>`;
  box.querySelector(".more") && box.querySelector(".more").remove();
  if (more) box.insertAdjacentHTML("beforeend", html); else box.innerHTML = html;
  if (res.next_offset != null) box.insertAdjacentHTML("beforeend", `<button class="btn ghost more">Show more</button>`);
  box.querySelectorAll(".sres:not([data-done])").forEach((el) => {
    el.dataset.done = 1; highlight(el.querySelector(".body"), terms);
    const m = res.messages.find((x) => x.id === Number(el.dataset.mid));
    if (m) el.onclick = (e) => { if (!e.target.closest(".mention, .chan-link, a")) jumpTo(m); };
  });
  hydrate(box);
  const btn = box.querySelector(".more"); if (btn) btn.onclick = () => { btn.disabled = true; runSearch(true); };
}

// open a message where it lives: its channel, scrolled to it (older pages loaded as needed), or its thread
async function jumpTo(m) {
  await refreshChannels();
  if (!state.channels.some((c) => c.id === m.channel.id)) return;
  await openChannel(m.channel.id);
  const rootId = m.thread_id || m.id;
  for (let i = 0; i < 40 && !state.byId.has(rootId) && state.hasOlder; i++) await loadOlder();
  const flash = (el) => { if (!el) return; el.scrollIntoView({ block: "center" }); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 2200); };
  flash($("messages").querySelector(`.msg[data-mid="${rootId}"]`));
  if (m.thread_id && state.byId.has(m.thread_id)) {
    await openThread(m.thread_id);
    flash($("panel-scroll").querySelector(`.msg[data-mid="${m.id}"]`));
  }
}

    c = await api("POST", "/channels", { body: { name: $("channel-name").value.trim(), description: $("channel-desc").value.trim() || null,
      private: $("channel-private").checked } });
  } catch (err) { $("channel-error").textContent = err.message; $("channel-error").classList.remove("hidden"); return; }
  const failed = [];
  for (const id of newChannel.picked) {
    try { await api("POST", `/channels/${c.id}/members`, { body: { principal_id: id } }); }
    catch { failed.push(nameOf(newChannel.people.find((p) => p.id === id))); }
  }
  $("channel-dialog").close(); $("channel-name").value = ""; $("channel-desc").value = "";
  await refreshChannels(); openChannel(c.id);
  if (failed.length) alert("The channel was created, but these could not be added: " + failed.join(", "));
});
window.addEventListener("hashchange", () => {
  if (location.hash === "#settings") { if (state.view !== "settings") openSettings(); return; }
  if (location.hash === "#activity") { if (state.view !== "activity") openActivity(); return; }
  if (location.hash === "#analytics") { if (state.view !== "analytics") openAnalytics(); return; }
  const c = state.channels.find((x) => x.name === decodeURIComponent(location.hash.slice(1)));
  if (c && (!state.current || c.id !== state.current.id)) openChannel(c.id);
});
boot();
</script>
</body>
</html>
