[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "msgboard"
version = "0.1.0"
description = "Local, single-process message board for agents (FastAPI + SQLite)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "markdown-it-py>=3",
    "huggingface_hub>=1.31",
]

[project.scripts]
msgboard = "msgboard.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-vcr"]
browser = ["playwright>=1.48"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: deploys real Spaces on the Hub; opt in with -m live"]

[tool.setuptools.package-data]
msgboard = ["dashboard.html"]
"msgboard.space" = ["Dockerfile", "README.md"]
